# Render Blueprint — one-click deploy for Smart Savings Tracker.
#
# The whole app runs as a SINGLE web service: the Express API also serves the
# built React SPA, so you get one URL (e.g. https://<name>.onrender.com) with
# no separate frontend host and no CORS setup.
#
# How to deploy:
#   1. Push this repo to GitHub (already done).
#   2. Go to https://dashboard.render.com → New → Blueprint.
#   3. Connect this repository and pick this branch.
#   4. Click "Apply". Render builds and deploys; your URL appears when live.
#
# Notes:
#   - The free plan spins down after ~15 min idle and cold-starts on the next
#     request (first load may take ~30–60s). Upgrade the plan to keep it warm.
#   - On the free plan the SQLite file lives on ephemeral storage and resets on
#     redeploy/restart. To make data durable, switch to a paid plan and attach
#     the disk block below (uncomment it) so SQLite is stored on a volume.
services:
  - type: web
    name: smart-savings-tracker
    runtime: node
    plan: free
    branch: main
    # --include=dev forces devDependencies (typescript, vite) to install even
    # though Render sets NODE_ENV=production during the build; the build tools
    # are needed to compile the server and bundle the client.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      # A strong secret is generated once and kept across deploys.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      # DURABLE STORAGE (recommended): set DATABASE_URL to a PostgreSQL
      # connection string and the app stores everything in Postgres, which
      # survives restarts and redeploys. Create a free database (e.g. Neon —
      # https://neon.tech) and paste its connection string in the Render
      # dashboard (Environment tab). `sync: false` means Render prompts for the
      # value instead of committing it to the repo.
      #
      # Without DATABASE_URL the app falls back to SQLite in ephemeral storage,
      # which resets on restart — fine for a quick demo, not for real data.
      - key: DATABASE_URL
        sync: false
      # Public URL of this service, used to build email verification links.
      # Set to your Render URL, e.g. https://smart-savings-tracker.onrender.com
      - key: APP_URL
        sync: false
      # Email verification via Resend (https://resend.com). New email accounts
      # must verify before logging in. If RESEND_API_KEY is unset, verification
      # links are logged to the service console instead of emailed.
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        value: Smart Savings Tracker <onboarding@resend.dev>
